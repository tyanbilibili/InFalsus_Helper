<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' helper-asset: data:">
  <title>Rating Overlay</title>
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="drawer" class="drawer expanded">
    <span class="frame"></span>
    <div class="tag left-tag">PLAYER</div>
    <div class="tag center-tag">RATING</div>
    <div class="tag right-tag">DELTA / 本次</div>
    <div class="player" id="ov-player">LOCAL</div>
    <div class="rating" id="ov-rating">--.---</div>
    <div class="delta" id="ov-delta">+0.000</div>
    <div class="phase" id="ov-phase">等待成绩</div>
    <div class="edge"></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
